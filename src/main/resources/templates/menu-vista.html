<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Gerencial - Restaurante</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-admin py-3 mb-5 shadow-lg">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img th:src="@{/img/logo.png}" alt="Logo del Restaurante" height="50" class="me-3 shadow-sm rounded">
            <span class="fw-bold fs-4" style="letter-spacing: 1px;">Restaurante OBITU</span>
        </a>

        <div class="d-flex text-white align-items-center">
            <span>
                <i class="bi bi-person-circle fs-5 me-2"></i>Gerente:
                <strong id="nombreGerenteVista" th:text="${nombreGerente}">Cargando...</strong>

                <button type="button" class="btn btn-sm btn-link text-warning p-0 ms-2 mb-1"
                        title="Modificar mi perfil"
                        th:if="${idGerente != -1}"
                        th:data-id="${idGerente}"
                        th:data-nombre="${nombreGerente}"
                        onclick="modificarGerente(this.getAttribute('data-id'), this.getAttribute('data-nombre'))">
                    <i class="bi bi-pencil-square fs-6"></i>
                </button>
            </span>
        </div>
    </div>
</nav>
<div class="container text-center">
    <div class="d-flex justify-content-center gap-3 mb-4">
        <button class="btn btn-brand btn-lg px-5 rounded-pill shadow" onclick="abrirModalFormulario()">
            <i class="bi bi-plus-circle me-2"></i> Añadir Nuevo Plato
        </button>
    </div>

    <h4 th:if="${#lists.isEmpty(alimentos)}" class="text-muted mt-5 bg-dark p-4 rounded-3 d-inline-block shadow">
        El menú está vacío. Añade un plato para comenzar.
    </h4>

    <div th:unless="${#lists.isEmpty(alimentos)}">
        <div class="row justify-content-center mb-4">
            <div class="col-md-7">
                <div class="input-group shadow-lg">
                    <span class="input-group-text bg-dark text-warning border-secondary"><i class="bi bi-search"></i></span>
                    <select class="form-select bg-dark text-white border-secondary fs-5" onchange="if(this.value) verDetalleReceta(this.value); this.value='';">
                        <option value="">Búsqueda rápida de platos...</option>
                        <option th:each="alimento : ${alimentos}" th:value="${alimento.nombre}" th:text="${alimento.nombre}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div id="carruselComidas" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div th:each="alimento, iterStat : ${alimentos}"
                     class="carousel-item"
                     th:classappend="${iterStat.index == 0} ? 'active' : ''">

                    <div class="carousel-item-container pb-5">
                        <div class="food-card">
                            <img th:src="@{'/img/' + ${alimento.nombre} + '.jpg'}"
                                 onerror="this.onerror=null; this.src='/img/default.jpg';"
                                 alt="Comida">
                            <div class="card-body">
                                <h2 class="fw-bold mb-2 text-uppercase" th:text="${alimento.nombre}">Nombre</h2>
                                <p class="price-tag mb-4" th:text="'$' + ${alimento.precio}">$0.00</p>

                                <div class="d-flex justify-content-center gap-3">
                                    <button class="btn btn-outline-info btn-lg" title="Ver Receta"
                                            th:data-nombre="${alimento.nombre}" onclick="verDetalleReceta(this.getAttribute('data-nombre'))">
                                        <i class="bi bi-eye"></i>
                                    </button>

                                    <button class="btn btn-outline-primary btn-lg" title="Editar Plato"
                                            th:data-id="${alimento.id}"
                                            th:data-nombre="${alimento.nombre}"
                                            th:data-precio="${alimento.precio}"
                                            onclick="abrirModalFormulario(this)">
                                        <i class="bi bi-pencil"></i>
                                    </button>

                                    <a class="btn btn-outline-danger btn-lg" title="Eliminar"
                                       th:href="@{/menu/eliminar/{id}(id=${alimento.id})}"
                                       onclick="return confirm('¿Seguro que deseas eliminar este plato de forma permanente?');">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carruselComidas" data-bs-slide="prev" th:if="${alimentos.size() > 1}">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carruselComidas" data-bs-slide="next" th:if="${alimentos.size() > 1}">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
        </div>
    </div>
</div>

<div class="modal fade" id="modalPlato" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h4 class="modal-title fw-bold text-warning" id="tituloModal">Nuevo Plato Completo</h4>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/menu/guardar}" method="POST" enctype="multipart/form-data">
                <div class="modal-body text-start pt-4">
                    <input type="hidden" id="inputId" name="id">

                    <div class="row mb-4">
                        <div class="col-8">
                            <label class="form-label text-light small mb-1 fw-bold">Nombre de la comida</label>
                            <input type="text" class="form-control form-control-lg" id="inputNombre" name="nombre" required>
                        </div>
                        <div class="col-4">
                            <label class="form-label text-light small mb-1 fw-bold">Precio ($)</label>
                            <input type="number" step="0.01" class="form-control form-control-lg" id="inputPrecio" name="precio" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-light small mb-1 fw-bold"><i class="bi bi-camera me-1"></i>Foto del Plato</label>
                        <input type="file" class="form-control" name="imagen" accept="image/*">
                        <div class="form-text text-secondary" style="font-size: 0.8rem;">Formatos: JPG, PNG. (Opcional)</div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label text-light small mb-0 fw-bold">Chef a cargo</label>
                            <div>
                                <button type="button" class="btn btn-sm btn-outline-warning py-0 px-2 me-1" onclick="crearNuevoChef()">
                                    <i class="bi bi-plus-lg"></i> Crear
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2" onclick="eliminarChefSeleccionado()">
                                    <i class="bi bi-trash"></i> Borrar
                                </button>
                            </div>
                        </div>
                        <select class="form-select form-select-lg" name="chefId" id="inputChef">
                            <option value="">-- Seleccionar Chef --</option>
                            <option th:each="chef : ${chefsDisponibles}" th:value="${chef.id}" th:text="${chef.nombre}"></option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-light small mb-1 fw-bold">Instrucciones de la Receta</label>
                        <textarea class="form-control" name="descripcionProceso" id="inputDescripcion" rows="3" placeholder="Paso a paso..."></textarea>
                    </div>

                    <div class="mb-2 p-3 border border-secondary rounded" style="background-color: rgba(0,0,0,0.3);">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label text-light small mb-0 fw-bold">Ingredientes requeridos</label>
                            <button type="button" class="btn btn-sm btn-warning text-dark fw-bold py-0 px-2" onclick="crearNuevoIngrediente()">
                                <i class="bi bi-plus-lg"></i> Crear Nuevo
                            </button>
                        </div>

                        <div class="input-group input-group-sm mb-3 mt-2">
                            <span class="input-group-text bg-dark text-warning border-secondary"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="buscadorIngredientes" placeholder="Buscar ingrediente..." onkeyup="filtrarIngredientes()">
                        </div>

                        <div class="checkbox-grid" id="contenedorIngredientes">
                            <div class="form-check ingrediente-item d-flex align-items-center" th:each="ing : ${ingredientesDisponibles}">
                                <input class="form-check-input me-2 mt-0 border-secondary" type="checkbox" name="ingredientesIds" th:value="${ing.id}" th:id="'ing_' + ${ing.id}">
                                <label class="form-check-label ingrediente-label flex-grow-1" th:for="'ing_' + ${ing.id}" th:text="${ing.descripcion}" th:id="'label_ing_' + ${ing.id}"></label>

                                <button type="button" class="btn btn-sm btn-link text-info p-0 ms-2"
                                        title="Modificar"
                                        th:data-id="${ing.id}"
                                        th:data-desc="${ing.descripcion}"
                                        onclick="modificarIngrediente(this.getAttribute('data-id'), this.getAttribute('data-desc'))">
                                    <i class="bi bi-pencil-square"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-outline-light btn-lg" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-brand btn-lg px-4"><i class="bi bi-save me-2"></i>Guardar Plato</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:src="@{/js/admin.js?v=2}"></script>

</body>
</html>
